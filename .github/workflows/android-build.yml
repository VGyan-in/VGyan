name: CD - Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Android Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK (${{ inputs.build_type || 'release' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Continuous Native Generation (Expo Prebuild)
        working-directory: client
        run: npx expo prebuild --platform android --clean

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        working-directory: client/android
        run: chmod +x gradlew

      - name: Build Debug APK
        if: ${{ (inputs.build_type || (startsWith(github.ref, 'refs/tags/') && 'release' || 'debug')) == 'debug' }}
        working-directory: client/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        if: ${{ (inputs.build_type || (startsWith(github.ref, 'refs/tags/') && 'release' || 'debug')) == 'release' }}
        working-directory: client/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate output APK
        id: locate-apk
        run: |
          BUILD_MODE="${{ inputs.build_type || (startsWith(github.ref, 'refs/tags/') && 'release' || 'debug') }}"
          APK_PATH=$(find client/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "build_mode=$BUILD_MODE" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vgyan-android-${{ steps.locate-apk.outputs.build_mode }}
          path: ${{ steps.locate-apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate-apk.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
