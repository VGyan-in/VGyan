name: CD - Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Android build type'
        required: true
        default: 'release'
        type: choice
        options: [debug, release]
  push:
    tags: ['v*.*.*']
    branches: [main, 'feat/**']
    paths:
      - 'client/**'
      - '.github/workflows/android-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android (${{ github.event.inputs.build_type || (startsWith(github.ref, 'refs/tags/') && 'release' || 'debug') }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || (startsWith(github.ref, 'refs/tags/') && 'release' || 'debug') }}
      # Baked into the app at build time; set under Settings → Secrets and variables → Actions → Variables.
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_CONSENT_VERSION: ${{ vars.EXPO_PUBLIC_CONSENT_VERSION || '1.0' }}
      EXPO_PUBLIC_ASR_MODEL_KN_URL: ${{ vars.EXPO_PUBLIC_ASR_MODEL_KN_URL }}
      EXPO_PUBLIC_ASR_MODEL_KN_MD5: ${{ vars.EXPO_PUBLIC_ASR_MODEL_KN_MD5 }}
      EXPO_PUBLIC_ASR_MODEL_KN_VERSION: ${{ vars.EXPO_PUBLIC_ASR_MODEL_KN_VERSION }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Generate native project (expo prebuild)
        working-directory: client
        run: npx expo prebuild --platform android --clean --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Release signing
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "VGYAN_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
            echo "VGYAN_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "VGYAN_UPLOAD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "VGYAN_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING=upload-key" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_UPLOAD_KEYSTORE_BASE64 is not set: the release build is signed with the DEBUG key (installable for testing, not for Play Store)."
            echo "VGYAN_ALLOW_DEBUG_SIGNED_RELEASE=1" >> "$GITHUB_ENV"
            echo "SIGNING=debug-key" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        if: env.BUILD_TYPE == 'debug'
        working-directory: client/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK and AAB
        if: env.BUILD_TYPE == 'release'
        working-directory: client/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        id: out
        run: |
          mkdir -p dist
          VERSION=$(node -p "require('./client/app.json').expo.version")
          SHA=$(git rev-parse --short HEAD)
          SUFFIX="${BUILD_TYPE}"
          [ "$BUILD_TYPE" = "release" ] && SUFFIX="release-${SIGNING}"
          for f in $(find client/android/app/build/outputs -name "*.apk" -o -name "*.aab"); do
            ext="${f##*.}"
            cp "$f" "dist/vgyan-${VERSION}-${SHA}-${SUFFIX}.${ext}"
          done
          ls -la dist
          (cd dist && sha256sum * > SHA256SUMS.txt)
          echo "name=vgyan-android-${VERSION}-${SHA}-${SUFFIX}" >> "$GITHUB_OUTPUT"
          # APK size budget check (speech models are downloaded on first use, not bundled).
          for apk in dist/*.apk; do echo "$(basename "$apk"): $(du -h "$apk" | cut -f1)"; done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.out.outputs.name }}
          path: dist/
          retention-days: 30

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ env.SIGNING != 'upload-key' }}
