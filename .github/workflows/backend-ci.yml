name: CI - Backend

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
    paths: ['backend/**', 'shared/**', '.github/workflows/backend-ci.yml']
  pull_request:
    branches: [main, develop]
    paths: ['backend/**', 'shared/**', '.github/workflows/backend-ci.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, migrations & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vgyan
          POSTGRES_PASSWORD: vgyan
          POSTGRES_DB: vgyan
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vgyan" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vgyan:vgyan@localhost:5432/vgyan
      TEST_DATABASE_URL: postgresql+psycopg://vgyan:vgyan@localhost:5432/vgyan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint & format check
        run: ruff check . && ruff format --check .
      - name: Apply migrations to an empty database
        run: alembic upgrade head
      - name: Models and migrations are in sync
        run: alembic check
      - name: Re-running migrations is a no-op
        run: alembic upgrade head
      - name: Tests
        run: pytest -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vgyan-backend:ci backend
