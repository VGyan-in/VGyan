name: CI - Backend

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'audit/**']
    paths: ['backend/**', 'shared/**', '.github/workflows/backend-ci.yml']
  pull_request:
    branches: [main, develop]
    paths: ['backend/**', 'shared/**', '.github/workflows/backend-ci.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, migrations & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vgyan
          POSTGRES_PASSWORD: vgyan
          POSTGRES_DB: vgyan
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vgyan" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vgyan:vgyan@localhost:5432/vgyan
      TEST_DATABASE_URL: postgresql+psycopg://vgyan:vgyan@localhost:5432/vgyan_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint & format check
        run: ruff check . && ruff format --check .
      - name: Apply migrations to an empty database
        run: alembic upgrade head
      - name: Models and migrations are in sync
        run: alembic check
      - name: Re-running migrations is a no-op
        run: alembic upgrade head
      - name: Tests
        run: pytest -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t vgyan-backend:ci backend
      # Boot the real image (migrations run in the entrypoint) and walk the API journey against it.
      - name: Start image with PostgreSQL
        run: |
          docker network create vg
          docker run -d --name db --network vg -e POSTGRES_USER=vgyan -e POSTGRES_PASSWORD=vgyan -e POSTGRES_DB=vgyan postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U vgyan && break; sleep 1; done
          docker run -d --name api --network vg -p 8000:8000             -e DATABASE_URL=postgresql+psycopg://vgyan:vgyan@db:5432/vgyan             -e JWT_SECRET=ci-only-secret-0123456789abcdefghijklmnop             -e RATE_LIMIT_ENABLED=false -e PUBLIC_BASE_URL=http://localhost:8000 vgyan-backend:ci
          for i in $(seq 1 60); do curl -fs http://localhost:8000/health/ready && break; sleep 1; done
          curl -fs http://localhost:8000/health/ready
          docker exec -e VGYAN_ADMIN_PASSWORD=ci-admin-password-123 api python -m app.cli create-admin --email admin@ci.test --name "CI Admin"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: End-to-end API journey
        env:
          VGYAN_API: http://localhost:8000
          VGYAN_ADMIN_EMAIL: admin@ci.test
          VGYAN_ADMIN_PASSWORD: ci-admin-password-123
        run: pip install httpx && python tools/e2e/api_journey.py
      - name: Database/storage integrity after the journey (incl. its deletion)
        run: docker exec api python -m app.cli integrity-check
      - name: API logs
        if: always()
        run: docker logs api 2>&1 | tail -200
