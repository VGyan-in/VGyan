name: Security & Audit

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  pull_request:
    paths:
      - 'client/package*.json'
      - 'web/package*.json'
      - 'backend/requirements*.txt'
      - 'audit-exceptions.json'
      - 'scripts/audit-gate.mjs'
  workflow_dispatch:

jobs:
  npm:
    name: npm audit (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Fails on any high/critical production advisory unless audit-exceptions.json documents it
      # with a reason and an expiry date.
      - name: Audit gate
        run: node scripts/audit-gate.mjs ${{ matrix.app }}

  python:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks CLI (MIT); the GitHub Action needs a paid licence for organisations.
      # Reviewed false positives live in .gitleaksignore.
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.28.0 git /repo --redact --no-banner
