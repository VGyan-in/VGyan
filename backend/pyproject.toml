[project]
name = "vgyan-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "S311", "S105", "S106", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"app/seed_data.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
